    <script>
      ;(function (locationInfo) {
        if (locationInfo.search[1] !== '/') return

        var decodedPath = locationInfo.search
          .slice(1)
          .split('&')
          .map(function (segment) {
            return segment.replace(/~and~/g, '&')
          })
          .join('?')

        window.history.replaceState(null, null, locationInfo.pathname.slice(0, -1) + decodedPath + locationInfo.hash)
      })(window.location)
    </script>
    <script>
      (function() {
        var t = localStorage.getItem('theme-preference');
        var d = t !== 'light';
        if (d) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>

    <div id="root"></div>
