<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      ;(function () {
        var locationInfo = window.location
        var pathSegmentsToKeep = locationInfo.hostname.endsWith('github.io') ? 1 : 0
        var pathParts = locationInfo.pathname.split('/')
        var basePath = pathParts.slice(0, 1 + pathSegmentsToKeep).join('/')
        var routePath = pathParts.slice(1 + pathSegmentsToKeep).join('/')

        locationInfo.replace(
          locationInfo.protocol +
            '//' +
            locationInfo.hostname +
            (locationInfo.port ? ':' + locationInfo.port : '') +
            basePath +
            '/?/' +
            routePath.replace(/&/g, '~and~') +
            (locationInfo.search ? '&' + locationInfo.search.slice(1).replace(/&/g, '~and~') : '') +
            locationInfo.hash,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
